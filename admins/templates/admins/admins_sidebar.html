{% load static %}

<aside class="admin-sidebar">

    <!-- Brand -->
    <div class="admin-sidebar-brand">

        <div class="admin-logo">
            <!-- College ERP Logo -->
            <svg viewBox="0 0 40 40" fill="none">
                <rect x="4" y="4" width="32" height="32" rx="8" stroke="currentColor" stroke-width="2" />
                <path d="M12 16L20 11L28 16L20 21L12 16Z" stroke="currentColor" stroke-width="2"
                    stroke-linejoin="round" />
                <path d="M15 19V25C15 27 17 29 20 29C23 29 25 27 25 25V19" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
        </div>

        <div class="admin-brand-text">
            <strong>College ERP</strong>
            <span>Admin Portal</span>
        </div>

    </div>


    <!-- Menu -->
    <nav class="admin-sidebar-menu">

        <!-- Dashboard -->
        <a href="{% url 'admins_dashboard' %}"
            class="admin-sidebar-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">

            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>

            <span>Dashboard</span>
        </a>


        <!-- Students -->
        <a href="{% url 'admin_students' %}" class="admin-sidebar-link {% if request.resolver_match.url_name == 'admin_students' %}active{% endif %}">

            <svg viewBox="0 0 24 24">
                <path d="M16 21V19C16 16.8 14.2 15 12 15H6C3.8 15 2 16.8 2 19V21"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21V19C22 17.2 20.8 15.7 19 15.2"></path>
                <path d="M16 3.2C17.7 3.7 19 5.2 19 7C19 8.8 17.7 10.3 16 10.8"></path>
            </svg>

            <span>Students</span>
        </a>


        <!-- Teachers -->
        <a href="{% url 'admin_teachers' %}" class="admin-sidebar-link" {% if request.resolver_match.url_name == 'admin_teachers' %}active{% endif %}>

                <path d="M17 4L19 6L23 2"></path>
            </svg>

            <span>Teachers</span>
        </a>

            <svg viewBox="0 0 24 24">
                <path d="M3 21H21"></path>
                <path d="M5 21V7L12 3L19 7V21"></path>
                <path d="M9 10H15"></path>
                <path d="M9 14H15"></path>
                <path d="M9 18H15"></path>

                <path d="M8 11H16"></path>

        <!-- Classes -->
        <a href="{% url 'admin_classes' %}" class="admin-sidebar-link">

                <path d="M8 2V6"></path>
                <path d="M16 2V6"></path>
                <path d="M3 10H21"></path>

        </a>


        <!-- Subjects -->
        <a href="{% url 'admin_subjects' %}" class="admin-sidebar-link">

            <svg viewBox="0 0 24 24">
                <path d="M4 4H20V20H4Z"></path>
                <path d="M8 8H16"></path>
                <path d="M8 12H16"></path>
                <path d="M8 16H13"></path>
            </svg>

            <span>Subjects</span>
        </a>


        <!-- Attendance -->
        <a href="{% url 'admin_attendance' %}" class="admin-sidebar-link">

            <svg viewBox="0 0 24 24">

                <path d="M8 9H16"></path>

                <path d="M8 17H13"></path>

            <svg viewBox="0 0 24 24">

                <path d="M10 21H14"></path>
            </svg>

            <span>Notices</span>
        </a>


        <!-- Reports -->

            <svg viewBox="0 0 24 24">
                <path d="M4 20V10"></path>
                <path d="M10 20V4"></path>
                <path d="M16 20V8"></path>
                <path d="M22 20V2"></path>
            </svg>

            <span>Reports</span>

        <a href="{% url 'admin_settings' %}" class="admin-sidebar-link">

    <!-- Logout -->

        <a href="#" class="admin-sidebar-link logout-link">

            <svg viewBox="0 0 24 24">
                <path d="M10 17L15 12L10 7"></path>
                <path d="M15 12H3"></path>
                <path d="M21 19V5C21 3.9 20.1 3 19 3H14"></path>
